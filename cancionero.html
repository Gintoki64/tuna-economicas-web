<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancionero - Tuna de Económicas</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0b0b">
  <link rel="icon" type="image/png" href="images/opt/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Yellowtail&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="cancionero.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar scrolled">
    <div class="nav-container">
      <a href="index.html" class="nav-logo" aria-label="Tuna de Económicas, inicio">
        <img src="images/opt/escudo-160.png" alt="" width="44" height="44">
        <span>Tuna de <strong>Económicas</strong></span>
      </a>
      <a href="index.html" class="btn btn-ghost btn-sm">&larr; Inicio</a>
    </div>
  </header>

  <!-- Password Overlay -->
  <div class="password-overlay" id="password-overlay">
    <div class="password-modal">
      <h2>Acceso al <span class="script">Cancionero</span></h2>
      <p>Introduce la contraseña para acceder</p>
      <input type="password" id="password-input" placeholder="Contraseña" aria-label="Contraseña" autocomplete="current-password">
      <button class="btn-cta" id="password-btn">Entrar</button>
      <p class="password-error" id="password-error" role="alert">Contraseña incorrecta</p>
    </div>
  </div>

  <!-- Main Content (hidden until authenticated) -->
  <main class="cancionero-main" id="cancionero-main" style="display:none;">
    <div class="container">
      <h1 class="section-title">Cancion<span class="script">ero</span></h1>
      <div class="cancionero-search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" class="cancionero-search" id="search-input" placeholder="Buscar canción..." aria-label="Buscar canción">
      </div>
      <div class="songs-container" id="songs-container">
        <p class="songs-loading">Cargando canciones...</p>
      </div>
    </div>
  </main>

  <script src="cancionero.js"></script>
</body>
</html>
